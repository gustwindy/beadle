<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Beadle</title>
    </head>
<body>
    <nav>
        <a href="/" class="logo">beadle logo</a> v0.1.0
        <div>

        </div>
    </nav>
    <div class="content">
        <div class="welcome">
            <span class="logo"></span>
            <h1>Today's beadle: #{id}</h1>
            <a href="aaa">{data.streak}</a>
        </div>
        <div class="game active">
            <div class="drawing">
                <img src="/have fun spanier/sam/sam4.png" alt="drawing">
            </div>
            <div class="guess-box">
                <div class="history">
                    <span class="past-guess">
                        <span class="guess"><span class="label">&gt;</span> previous</span>
                        <span class="hint"><span class="label">hint:</span> something something something</span>
                    </span>
                    <span class="past-guess">
                        <span class="guess"><span class="label">&gt;</span> previous</span>
                        <span class="hint"><span class="label">hint:</span> something something something</span>
                    </span>
                    <span class="past-guess">
                        <span class="guess"><span class="label">&gt;</span> previous</span>
                        <span class="hint"><span class="label">hint:</span> something something something</span>
                    </span>
                    <span class="past-guess">
                        <span class="guess"><span class="label">&gt;</span> previous</span>
                        <span class="hint"><span class="label">hint:</span> something something something</span>
                    </span>
                    <span class="past-guess">
                        <span class="guess"><span class="label">&gt;</span> previous</span>
                        <span class="hint"><span class="label">hint:</span> something something something</span>
                    </span>
                </div>
                <div class="guess-input">
                    <input>
                    <button type="button">Submit</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/scripts/index.js" type="module"></script>
</body>
</html>
